name: TradeLink SEO Phase 1 checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database; the integration tests drop and recreate their tables.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: automation/seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py semrush.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Confirm no publishing API in Phase 1
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ['api.github.com', 'merge_pull_request', 'git push', 'PUT /repos/']
          for path in Path('.').glob('*.py'):
              text = path.read_text()
              assert not any(x in text for x in forbidden), path
          print('No GitHub publishing API found')
          PY
  live-site-crawl:
    # Depends on the production site being reachable; informational, not a required check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: automation/seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Live site crawl (read-only; no database writes)
        run: python main.py --dry-run
