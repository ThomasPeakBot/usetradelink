name: TradeLink SEO Phase 1 checks
on:
  pull_request:
    paths:
      - 'automation/seo/**'
      - 'docs/tradelink-seo-automation-plan.md'
      - '.github/workflows/seo-phase1.yml'
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: automation/seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Confirm no publishing API in Phase 1
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('main.py').read_text()
          forbidden = ['api.github.com', 'merge_pull_request', 'git push', 'PUT /repos/']
          assert not any(x in text for x in forbidden)
          print('No GitHub publishing API found')
          PY
