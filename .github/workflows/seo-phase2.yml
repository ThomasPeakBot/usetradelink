name: TradeLink SEO Phase 2 approval tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  approval-gateway-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database; the integration tests drop and recreate their tables.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: automation/approvals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py policy.py content_guard.py
      - run: python -m unittest discover -s tests -v
      - name: Ensure publication is fail-closed
        run: |
          python - <<'PY'
          from app import armed
          assert armed() is False, "Without secrets there must be no publishing"
          print("Publishing off by default")
          PY
